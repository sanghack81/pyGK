[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyGK"
dynamic = ["version"]
description = "A suite of graph kernels written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["NOTICE.txt"]
authors = [
  { name = "Sanghack Lee", email = "sanghack.lee@gmail.com" },
]
keywords = ["graph", "graph-kernel", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.2",
  "networkx>=2.8",
  "numpy>=1.23",
  "scipy>=1.12",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/sanghack81/pyGK"
Issues = "https://github.com/sanghack81/pyGK/issues"

[tool.setuptools]
packages = ["pygk"]

[tool.setuptools.dynamic]
version = { attr = "pygk.__version__" }

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["pygk/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
